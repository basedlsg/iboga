[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iboga"
version = "0.1.0"
description = "Long-horizon evaluation of evidence-gated memory for coding agents"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
reliability = "reliability.cli:main"
grimoire = "grimoire.cli:main"

[tool.setuptools.packages.find]
include = ["grimoire*", "iboga_experiment*", "reliability*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
